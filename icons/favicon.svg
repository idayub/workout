<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hevyCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="hevyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E6FFF"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E6FFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Canvas (Near-black gym-floor surface) -->
  <rect width="512" height="512" rx="116" fill="url(#hevyCanvas)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#262C36" stroke-width="4"/>

  <!-- Hevy Blue Soft Ring Accent -->
  <circle cx="256" cy="256" r="172" fill="#14233F" opacity="0.6"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#1E6FFF" stroke-width="8" opacity="0.4" stroke-dasharray="24 12"/>

  <!-- Hevy Barbell Instrument Emblem -->
  <g filter="url(#subtleGlow)" fill="#FFFFFF">
    <!-- Barbell Shaft -->
    <rect x="136" y="244" width="240" height="24" rx="12" fill="#FFFFFF"/>

    <!-- Inner Collars -->
    <rect x="180" y="216" width="16" height="80" rx="8" fill="#1E6FFF"/>
    <rect x="316" y="216" width="16" height="80" rx="8" fill="#1E6FFF"/>

    <!-- Primary Weight Plates (Hevy Blue) -->
    <rect x="144" y="176" width="26" height="160" rx="12" fill="url(#hevyBlue)"/>
    <rect x="342" y="176" width="26" height="160" rx="12" fill="url(#hevyBlue)"/>

    <!-- Outer Weight Plates -->
    <rect x="110" y="196" width="24" height="120" rx="10" fill="#FFFFFF"/>
    <rect x="378" y="196" width="24" height="120" rx="10" fill="#FFFFFF"/>

    <!-- Knurling Grip lines on bar -->
    <line x1="230" y1="246" x2="230" y2="266" stroke="#161B22" stroke-width="3"/>
    <line x1="242" y1="246" x2="242" y2="266" stroke="#161B22" stroke-width="3"/>
    <line x1="256" y1="246" x2="256" y2="266" stroke="#161B22" stroke-width="3"/>
    <line x1="270" y1="246" x2="270" y2="266" stroke="#161B22" stroke-width="3"/>
    <line x1="282" y1="246" x2="282" y2="266" stroke="#161B22" stroke-width="3"/>
  </g>

  <!-- Small PR Gold Star Top Right -->
  <path d="M 374 136 L 380 152 L 396 154 L 384 166 L 388 182 L 374 174 L 360 182 L 364 166 L 352 154 L 368 152 Z" fill="#F5B83D"/>
</svg>
